  <script>
    (function () {
      try {
        var theme = localStorage.getItem('tiffinlink_theme') || 'light';
        var isDark = false;
        if (theme === 'dark') {
          isDark = true;
        } else if (theme === 'system') {
          isDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
        }
        var root = document.documentElement;
        if (isDark) {
          root.classList.add('dark');
          root.setAttribute('data-theme', 'dark');
        } else {
          root.classList.remove('dark');
          root.setAttribute('data-theme', 'light');
        }
        if (localStorage.getItem('tiffinlink_compact') === 'true') {
          root.classList.add('compact-density');
        }
        if (localStorage.getItem('tiffinlink_reduce_motion') === 'true') {
          root.classList.add('reduce-motion');
        }
      } catch (e) {}
    })();

    // ─── COMPLETE DEVTOOLS & INSPECT MODE SHIELD ───
    (function blockInspectMode() {
      // 1. Block Mouse Right-Click (Context Menu across all browsers)
      document.addEventListener('contextmenu', function (e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }, { capture: true });

      // 2. Block Keyboard Shortcuts (Windows, Linux, macOS)
      document.addEventListener('keydown', function (e) {
        var key = (e.key || '').toUpperCase();
        var code = e.keyCode || e.which;
        var isCtrlOrCmd = e.ctrlKey || e.metaKey;

        // F12 key (Windows, Linux, macOS)
        if (key === 'F12' || code === 123) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Ctrl + Shift + [I, C, J, K, Z, F] or Cmd + Option + [I, C, J, K, Z, F] or Cmd + Shift + [C, I, K, Z]
        if (isCtrlOrCmd && (e.shiftKey || e.altKey)) {
          if (['I', 'C', 'J', 'K', 'Z', 'F'].includes(key) || [73, 67, 74, 75, 90, 70].includes(code)) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }

        // View Page Source: Ctrl + U / Cmd + U / Cmd + Option + U
        if (isCtrlOrCmd && (key === 'U' || code === 85)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // Save Page Source: Ctrl + S / Cmd + S
        if (isCtrlOrCmd && (key === 'S' || code === 83)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }
      }, { capture: true });

      // 3. Block Drag-to-Inspect / Dropping media into browser tabs
      document.addEventListener('dragstart', function (e) {
        if (e.target && (e.target.nodeName === 'IMG' || e.target.nodeName === 'VIDEO')) {
          e.preventDefault();
        }
      }, { capture: true });
    })();
  </script>

  <!-- Complete Anti-Inspect & DevTools Shield (PC, Laptop, Tablet, Mobile) -->
  <script>
    (function () {
      // 1. Disable Right-Click Context Menu Everywhere
      function blockContextMenu(e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      }
      window.addEventListener('contextmenu', blockContextMenu, true);
      document.addEventListener('contextmenu', blockContextMenu, true);

      // 2. Disable Keyboard Shortcuts for Inspect, Console, Source, and Saving
      function blockDevToolsKeys(e) {
        // F12
        if (e.key === 'F12' || e.keyCode === 123) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        var isCtrlOrCmd = e.ctrlKey || e.metaKey;

        // Ctrl/Cmd + Shift + (I, J, C, K, E, S)
        if (isCtrlOrCmd && e.shiftKey) {
          var k = (e.key || '').toUpperCase();
          var c = e.keyCode;
          if (k === 'I' || k === 'J' || k === 'C' || k === 'K' || k === 'E' || k === 'S' ||
              c === 73 || c === 74 || c === 67 || c === 75 || c === 69 || c === 83) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }

        // Ctrl/Cmd + (U = View Source, S = Save Page)
        if (isCtrlOrCmd && !e.shiftKey) {
          var k2 = (e.key || '').toUpperCase();
          var c2 = e.keyCode;
          if (k2 === 'U' || k2 === 'S' || c2 === 85 || c2 === 83) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }

        // Ctrl/Cmd + (C = Copy, V = Paste, X = Cut, A = Select All)
        if (isCtrlOrCmd && !e.shiftKey && !e.altKey) {
          var kCopy = (e.key || '').toUpperCase();
          var cCopy = e.keyCode;
          if (kCopy === 'C' || kCopy === 'V' || kCopy === 'X' || kCopy === 'A' ||
              cCopy === 67 || cCopy === 86 || cCopy === 88 || cCopy === 65) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }

        // Windows alternate Copy/Paste (Ctrl+Insert / Shift+Insert)
        if ((e.ctrlKey || e.shiftKey) && (e.key === 'Insert' || e.keyCode === 45)) {
          e.preventDefault();
          e.stopPropagation();
          return false;
        }

        // macOS Alt + Cmd + (I, J, C)
        if (e.altKey && (e.metaKey || e.ctrlKey)) {
          var k3 = (e.key || '').toUpperCase();
          var c3 = e.keyCode;
          if (k3 === 'I' || k3 === 'J' || k3 === 'C' || c3 === 73 || c3 === 74 || c3 === 67) {
            e.preventDefault();
            e.stopPropagation();
            return false;
          }
        }
      }

      window.addEventListener('keydown', blockDevToolsKeys, true);
      document.addEventListener('keydown', blockDevToolsKeys, true);

      // 3. Prevent dragging to inspect source or drag images
      window.addEventListener('dragstart', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          return true;
        }
        e.preventDefault();
        return false;
      }, true);

      // 4. Mobile multi-finger developer tap shield
      window.addEventListener('touchstart', function (e) {
        if (e.touches && e.touches.length > 2) {
          e.preventDefault();
        }
      }, { passive: false });

      // 5. Turn off copy, cut, paste, and text selecting website-wide
      var blockCopyPaste = function (e) {
        e.preventDefault();
        e.stopPropagation();
        return false;
      };
      window.addEventListener('copy', blockCopyPaste, true);
      document.addEventListener('copy', blockCopyPaste, true);
      window.addEventListener('cut', blockCopyPaste, true);
      document.addEventListener('cut', blockCopyPaste, true);
      window.addEventListener('paste', blockCopyPaste, true);
      document.addEventListener('paste', blockCopyPaste, true);

      window.addEventListener('selectstart', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          return true;
        }
        e.preventDefault();
        return false;
      }, true);
      document.addEventListener('selectstart', function (e) {
        if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA')) {
          return true;
        }
        e.preventDefault();
        return false;
      }, true);
    })();
  </script>
