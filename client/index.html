  <style>
    .reveal-on-scroll {
      opacity: 0;
      transform: translateY(30px);
      transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal-on-scroll.active {
      opacity: 1;
      transform: translateY(0);
    }

    .parallax-container {
      overflow: hidden;
    }

    .parallax-img {
      transform: scale(1.1);
      transition: transform 0.5s ease-out;
    }

    .custom-cursor {
      width: 8px;
      height: 8px;
      background: #DED9D1;
      /* Sand Neutral */
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, background-color 0.3s ease, transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.2s ease;
    }

    .custom-cursor.cursor-hidden {
      transform: translate(-50%, -50%) scale(0) !important;
      opacity: 0 !important;
    }

    .custom-cursor-follower {
      width: 32px;
      height: 32px;
      border: 1px solid rgba(74, 66, 56, 0.4);
      /* Clay earth */
      border-radius: 50%;
      position: fixed;
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: width 0.3s ease, height 0.3s ease, border-color 0.3s ease, background-color 0.3s cubic-bezier(0.16, 1, 0.3, 1), transform 0.08s ease-out;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .custom-cursor-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 700;
      color: #FFFFFF;
      /* White */
      letter-spacing: 0.15em;
      text-transform: uppercase;
      line-height: 1;
      opacity: 0;
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      white-space: nowrap;
      margin: 0;
      padding: 0;
      display: block;
      text-shadow: 0 1px 3px rgba(0, 0, 0, 0.3);
      pointer-events: none;
    }

    /* Custom cursor active states */
    .custom-cursor.hovering-link {
      width: 16px;
      height: 16px;
      background: #1A1A1A;
      mix-blend-mode: difference;
    }

    .custom-cursor-follower.hovering-link {
      width: 48px;
      height: 48px;
      border-color: #1A1A1A;
      background: rgba(26, 26, 26, 0.05);
    }

    .custom-cursor-follower.hovering-provider {
      width: 85px;
      height: 85px;
      background: rgba(26, 26, 26, 0.55);
      /* Translucent dark glass */
      border-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
    }

    .custom-cursor-follower.hovering-provider .custom-cursor-text {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    .custom-cursor-follower.hovering-category {
      width: 75px;
      height: 75px;
      background: rgba(74, 66, 56, 0.55);
      /* Translucent clay glass */
      border-color: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px) saturate(140%);
      -webkit-backdrop-filter: blur(10px) saturate(140%);
    }

    .custom-cursor-follower.hovering-category .custom-cursor-text {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1);
    }

    /* Elegant letter reveal on scroll */
    .reveal-char {
      display: inline-block;
      transform: translateY(100%);
      opacity: 0;
      transition: transform 0.8s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .reveal-char.active {
      transform: translateY(0);
      opacity: 1;
    }

    .nav-underline::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 1px;
      background: currentColor;
      transition: width 0.4s ease;
    }

    .nav-underline:hover::after {
      width: 100%;
    }

    .line-draw {
      width: 0;
      height: 1px;
      background: #DED9D1;
      transition: width 1.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .line-draw.active {
      width: 100%;
    }

    /* Unified Premium Button Design System */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: 'Hanken Grotesk', sans-serif;
      font-size: 13px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      padding: 1rem 2rem;
      border-radius: 12px;
      border: 1px solid transparent;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      outline: none;
      user-select: none;
    }

    .btn-primary {
      background-color: #1A1A1A;
      color: #F5F3EF;
      box-shadow: 0 4px 14px rgba(26, 26, 26, 0.1);
    }

    .btn-primary:hover:not(:disabled) {
      background-color: #4A4238;
      color: #F5F3EF;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(74, 66, 56, 0.15);
    }

    .btn-primary:active:not(:disabled) {
      transform: translateY(0) scale(0.98);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
  </style>
</head>

<body
  class="bg-bone-white text-onyx-black font-body-md overflow-x-hidden selection:bg-onyx-black selection:text-bone-white">
  <div class="custom-cursor hidden md:block" id="cursor"></div>
  <div class="custom-cursor-follower hidden md:block" id="cursor-follower">
    <span class="custom-cursor-text" id="cursor-text"></span>
  </div>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
